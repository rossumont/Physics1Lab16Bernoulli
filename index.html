<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bernoulli's Principle</title>
<style>
:root{--bg:#0B1A2B;--fg:#F3EEDF;--mut:#8C9AAB;--g:#7FD4A8;--a:#E8B23A;--line:rgba(243,238,223,.18);--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI","Noto Sans Thai",Sarabun,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px;-webkit-user-select:none;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;gap:8px}
h1{font-size:clamp(17px,4.5vw,22px);font-weight:800}
.sub{color:var(--mut);font-size:12px;margin-top:2px}
.hb{display:flex;gap:6px;flex:none}
.ob{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 14px;scrollbar-width:none;flex-wrap:nowrap;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg);border-radius:16px;padding:5px 11px;font:13px var(--mono);cursor:pointer}
.chip.on{border-color:var(--g);color:var(--g);background:rgba(127,212,168,.1)}
.chip.pt.on{border-color:var(--a);color:var(--a);background:rgba(232,178,58,.1)}
.lbl{flex:none;color:var(--mut);font:11px var(--mono);margin-left:4px}
.sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 4px}
.parts{display:flex;gap:0;margin:4px 14px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}
.parts button{border:none;background:transparent;color:var(--mut);padding:6px 16px;font-size:13px;cursor:pointer}
.parts button.on{background:rgba(232,178,58,.15);color:var(--a);font-weight:700}
.crows{padding:2px 0}
.crows .chips{padding-top:3px;padding-bottom:3px}
.chip.yc.on{border-color:var(--a);color:var(--a);background:rgba(232,178,58,.1)}
.lbl.gl{color:var(--g)}.lbl.al{color:var(--a)}
main{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tbar{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 12px;margin:0 12px;border:1px solid var(--line);border-radius:14px;background:rgba(11,26,43,.88)}
.cmd{border:1px solid var(--a);color:var(--a);background:transparent;border-radius:10px;padding:8px 10px;font-size:14px;min-width:92px;cursor:pointer}
.clock{font:600 clamp(22px,6vw,30px) var(--mono);letter-spacing:1px;min-width:7.2ch;text-align:center}
.play{width:46px;height:46px;border-radius:50%;border:none;background:var(--g);color:#0B1A2B;font-size:17px;cursor:pointer}
.play.run{background:var(--a)}
.rst{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:18px;cursor:pointer}
.credit{font-size:10px;color:var(--mut);text-align:center;padding:6px 10px calc(6px + env(safe-area-inset-bottom));white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.credit::-webkit-scrollbar{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:14px}
.modal.show{display:flex}
.box{background:#102338;border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.box h3{font-size:15px;margin:14px 0 6px;color:var(--a)}
.box h3:first-child{margin-top:0}
input,textarea{width:100%;background:#0B1A2B;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px;font:14px var(--mono);margin:4px 0;user-select:text;-webkit-user-select:text}
textarea{height:70px;font-size:11px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.btn{border:1px solid var(--g);color:var(--g);background:transparent;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
table{width:100%;border-collapse:collapse;font:12px var(--mono)}
td,th{border-bottom:1px solid var(--line);padding:4px;text-align:right}
th{color:var(--mut);font-weight:400}
.msg{font-size:12px;color:var(--a);min-height:16px;margin-top:4px}
.mono{font:12px var(--mono);margin-top:6px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div><h1 id="t1"></h1><div class="sub" id="t2"></div></div>
  <div class="hb"><button id="langBtn" class="ob"></button><button id="teachBtn" class="ob"></button></div>
</header>
<div id="parts" class="parts"></div>
<div id="chips" class="crows"></div>
<main id="stage"><canvas id="cv"></canvas></main>
<div class="tbar">
  <button id="cmdBtn" class="cmd"></button>
  <div id="clock" class="clock">00:00.00</div>
  <button id="playBtn" class="play">▶</button>
  <button id="resetBtn" class="rst">↺</button>
</div>
<div id="credit" class="credit"></div>

<div id="pwModal" class="modal"><div class="box">
  <h3 id="pwTitle"></h3>
  <input id="pwIn" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="msg" id="pwMsg"></div>
  <div class="row"><button class="btn" id="pwOk"></button><button class="btn" id="pwCancel" style="border-color:var(--line);color:var(--fg)"></button></div>
</div></div>
<div id="tModal" class="modal"><div class="box" id="tBox"></div></div>

<script>
const $=id=>document.getElementById(id);
const L={
en:{t1:"Bernoulli's Principle",t2:"Venturi tube · Torricelli's law · Height difference",p1:"Venturi",p2:"Torricelli",p3:"Height",rise:"Rise",d3:"Top Ø",flow:"Flow",thr:"Throat",collect:"Collect",drain:"Drain",on:"Open hole",off:"Close hole",teach:"Teacher",lang:"ไทย",
credit:"Asst.Prof.Dr. Rossumont Jaryabhand · Rajamangala University of Technology Tawan-ok, Uthenthawai Campus · No Right Reserved",
pw:"Teacher password",enter:"Enter",cancel:"Cancel",wrong:"Wrong password",close:"Close",ans:"Answer key",set:"Settings",noise:"Noise",parts:"Parts",both:"All",free:"Student",link:"Student link",gen:"Generate link",copy:"Copy",copied:"Copied",chg:"Change password",newpw:"New password",email:"Email",admpw:"Admin password",save:"Save",saved:"Saved (this browser)",bad:"Email or admin password incorrect",tube:"Tube",full:"FULL",hl:"Water level h",yl:"Hole height y",ws:"Lab worksheet",wsOpen:"Open worksheet",q:"Flow rate Q",t1L:"Time for 1 L",tw:"Throat"},
th:{t1:"กฎของเบอร์นูลลี",t2:"ท่อเวนทูรี · กฎของทอร์ริเชลลี · ความสูงต่างกัน",p1:"เวนทูรี",p2:"ทอร์ริเชลลี",p3:"ความสูงต่างกัน",rise:"ยกสูง",d3:"Ø ท่อบน",flow:"อัตราไหล",thr:"คอคอด",collect:"เก็บน้ำ",drain:"เทน้ำทิ้ง",on:"เปิดรู",off:"ปิดรู",teach:"ครู",lang:"EN",
credit:"ผศ.ดร.รสสุมนต์ จารยะพันธุ์ · มหาวิทยาลัยเทคโนโลยีราชมงคลตะวันออก อุเทนถวาย · ไม่สงวนลิขสิทธิ์",
pw:"รหัสผ่านครู",enter:"เข้า",cancel:"ยกเลิก",wrong:"รหัสผ่านไม่ถูกต้อง",close:"ปิด",ans:"เฉลย",set:"ตั้งค่า",noise:"ความคลาดเคลื่อน",parts:"ส่วนการทดลอง",both:"ทั้งหมด",free:"นศ.เลือกเอง",link:"ลิงก์นักศึกษา",gen:"สร้างลิงก์",copy:"คัดลอก",copied:"คัดลอกแล้ว",chg:"เปลี่ยนรหัสผ่าน",newpw:"รหัสผ่านใหม่",email:"อีเมล",admpw:"รหัสผ่านผู้ดูแล",save:"บันทึก",saved:"บันทึกแล้ว (เฉพาะเบราว์เซอร์นี้)",bad:"อีเมลหรือรหัสผ่านผู้ดูแลไม่ถูกต้อง",tube:"ท่อ",full:"เต็ม",hl:"ระดับน้ำ h",yl:"ความสูงรู y",ws:"ใบทดลอง",wsOpen:"เปิดใบทดลอง",q:"อัตราการไหล Q",t1L:"เวลาเก็บน้ำ 1 L",tw:"คอคอด"}};

/* ---------- settings ---------- */
const PWDEF="9;5:4*5\u2018", ADM_EMAIL="rossumont@gmail.com", ADM_PW="LhaMoAPL9545=";
const normPw=s=>(s||"").replace(/[\u2018\u2019\u201A\u201B'`\u00B4]/g,"'").replace(/[\u201C\u201D"]/g,'"').trim();
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
let CFG={noise:1,thr:0,parts:0}, STUDENT=false, UNLOCK=false;
function enc(o){const s=btoa(JSON.stringify(o)).replace(/=+$/,"");const r=()=>Math.random().toString(36).slice(2,8).padEnd(6,"x");return r()+s.split("").reverse().join("")+r();}
function dec(k){try{let s=k.slice(6,-6).split("").reverse().join("");while(s.length%4)s+="=";return JSON.parse(atob(s))}catch(e){return null}}
(function(){const k=new URLSearchParams(location.search).get("k");const o=k&&dec(k);
 if(o){CFG=Object.assign(CFG,o);STUDENT=true}else{try{const s=JSON.parse(ls("bern_cfg")||"null");if(s)CFG=Object.assign(CFG,s)}catch(e){}}})();
function saveCfg(){if(!STUDENT)ls("bern_cfg",JSON.stringify(CFG))}

/* ---------- physics ---------- */
const g=9.81,D1=26,QL=[0.06,0.09,0.12,0.15,0.18],HA=[420,412,404,396,388],UT=[0.1,0.31,0.45,0.68,0.94];
const area=d=>Math.PI*Math.pow(d/2000,2);
const TANK_A=75e-4,HOLE_D=4,AR=TANK_A/area(HOLE_D);
function diam(u,d2){if(u<0.2)return D1;if(u<0.42)return D1-(D1-d2)*(u-0.2)/0.22;if(u<0.48)return d2;if(u<0.88)return d2+(D1-d2)*(u-0.48)/0.4;return D1}
const S={part:(STUDENT&&+CFG.parts)||1,flow:3,thr:12,h:20,hd:20,y:30,coll:true,vol:0,on:false,lang:"en",dz:100,d3:26,vol3:0};
const thr=()=>CFG.thr||S.thr;
const NZ={qf:1,bias:[0,0,0,0,0],cv:0.97};
function mkNoise(){const n=+CFG.noise||0;NZ.qf=1+n*(Math.random()-.5)*0.03;NZ.bias=NZ.bias.map(()=>n*(Math.random()-.5)*2);NZ.cv=0.97+n*(Math.random()-.5)*0.02}
function venturi(){const d2=thr(),Q=QL[S.flow-1]/1000*NZ.qf;const D=UT.map(u=>+diam(u,d2).toFixed(1));const v=D.map(d=>Q/area(d));
 const v1=v[0],v2=v[2],dk=(v2*v2-v1*v1)/(2*g),loss=[0,0,0,0.08*dk,0.15*dk];
 const h=v.map((vi,i)=>HA[S.flow-1]/1000+(v1*v1-vi*vi)/(2*g)-loss[i]);return{D,v,h,Q}}
mkNoise();
let VT=venturi(); const hd=VT.h.map((x,i)=>x*1000+NZ.bias[i]);
/* part 3: pipe rising to a higher level */
const U3=[0.12,0.34,0.66,0.88];
function z3(u){return u<0.42?0:u<0.55?S.dz*(u-0.42)/0.13:S.dz}
function diam3(u){return u<0.42?D1:u<0.55?D1+(S.d3-D1)*(u-0.42)/0.13:S.d3}
function rise(){const Q=QL[S.flow-1]/1000*NZ.qf,D=U3.map(diam3),z=U3.map(z3),v=D.map(d=>Q/area(d)),f=Math.pow(Q/0.18e-3,2)*0.016;
 const h=v.map((vi,i)=>HA[S.flow-1]/1000+(v[0]*v[0]-vi*vi)/(2*g)-f*(U3[i]-U3[0]));return{D,z,v,h,Q}}
let VR=rise(); const hd3=VR.h.map((x,i)=>x*1000+NZ.bias[i]);
const P=Array.from({length:70},()=>({u:Math.random(),o:Math.random()*2-1}));

/* ---------- canvas ---------- */
const cv=$("cv"),ctx=cv.getContext("2d"),buf=document.createElement("canvas"),b=buf.getContext("2d");
let W=0,H=0,DPR=1,T=0,last=performance.now();
function resize(){const r=$("stage").getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2.5);W=r.width;H=r.height;[cv,buf].forEach(c=>{c.width=Math.max(1,Math.round(W*DPR));c.height=Math.max(1,Math.round(H*DPR))})}
new ResizeObserver(resize).observe($("stage"));resize();

const FG="rgba(243,238,223,", WATER="rgba(70,150,215,.78)", GLASS="rgba(200,230,255,.6)", MONO='ui-monospace,"SF Mono",Menlo,Consolas,monospace';
function txt(c,s,x,y,al,sz,col){c.font=(sz||10)+"px "+MONO;c.textAlign=al||"left";c.textBaseline="middle";c.fillStyle=col||FG+".7)";c.fillText(s,x,y)}

function update(dt){
 if(S.part===1){VT=venturi();
  for(let i=0;i<5;i++)hd[i]+=(VT.h[i]*1000+NZ.bias[i]-hd[i])*Math.min(1,dt*2.5);
  if(S.coll)S.vol=Math.min(3,S.vol+VT.Q*1000*dt);else S.vol=Math.max(0,S.vol-0.8*dt);
  const d2=thr();P.forEach(p=>{p.u+=dt*(VT.Q/area(diam(p.u,d2)))*0.22;if(p.u>1)p.u-=1})}
 else if(S.part===3){VR=rise();
  for(let i=0;i<4;i++)hd3[i]+=(VR.h[i]*1000+NZ.bias[i]-hd3[i])*Math.min(1,dt*2.5);
  if(S.coll)S.vol3=Math.min(3,S.vol3+VR.Q*1000*dt);else S.vol3=Math.max(0,S.vol3-0.8*dt);
  P.forEach(p=>{p.u+=dt*(VR.Q/area(diam3(p.u)))*0.22;if(p.u>1)p.u-=1})}
 else if(S.part===2&&S.on&&S.hd>0){const hm=S.hd/100;S.hd=Math.max(0,S.hd-100*NZ.cv*Math.sqrt(2*g*hm)/AR*dt)}
}

function drawP1(c){
 const port=W<H*1.05,m=10,d2=thr(),L1=L[S.lang];
 const tankW=port?Math.max(64,W*0.23):Math.min(190,W*0.17);
 const tx1=W-m-8,tx0=tx1-tankW,x0=m+28,x1=tx0-24;
 const yP=Math.round(H*(port?0.64:0.62)),top=m+20,ppm=(yP-top)/450;
 const rmax=Math.max(7,Math.min(18,(x1-x0)*0.035,(H-yP)*0.1));
 const X=u=>x0+(x1-x0)*u,R=u=>rmax*diam(u,d2)/D1;
 // board
 c.fillStyle="rgba(255,255,255,.035)";c.fillRect(x0,yP-450*ppm,x1-x0,450*ppm);
 for(let mm=0;mm<=450;mm+=10){const y=yP-mm*ppm;c.strokeStyle=mm%50===0?FG+".34)":FG+".1)";c.lineWidth=1;c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke();
  if(mm%50===0){txt(c,String(mm),x0-4,y,"right",10);txt(c,String(mm),x1+3,y,"left",10)}}
 txt(c,"mm",x0-4,m+6,"right",10,FG+".5)");
 // outlet pipe
 const ro=rmax*0.75,xc=tx0+tankW*0.35,yT0=yP+rmax+34,yT1=H-m,yOut=yT0-6;
 c.fillStyle=WATER;c.strokeStyle=GLASS;c.lineWidth=1.5;
 c.beginPath();c.moveTo(X(1)-1,yP-ro);c.lineTo(xc+ro,yP-ro);c.lineTo(xc+ro,yOut);c.lineTo(xc-ro,yOut);c.lineTo(xc-ro,yP+ro);c.lineTo(X(1)-1,yP+ro);c.closePath();c.fill();c.stroke();
 // inlet + venturi body
 c.beginPath();c.moveTo(m,yP-rmax);for(let u=0;u<=1.0001;u+=0.01)c.lineTo(X(u),yP-R(u));
 for(let u=1;u>=-0.0001;u-=0.01)c.lineTo(X(u),yP+R(u));c.lineTo(m,yP+rmax);c.closePath();c.fill();c.stroke();
 txt(c,"Ø mm",m,yP+rmax+12,"left",9,FG+".5)");
 // particles
 c.fillStyle="rgba(255,255,255,.55)";P.forEach(p=>{c.beginPath();c.arc(X(p.u),yP+p.o*R(p.u)*0.7,1.3,0,7);c.fill()});
 // tubes
 const tw=Math.max(5,Math.min(10,rmax*0.55));
 UT.forEach((u,i)=>{const x=X(u),yb=yP-R(u)+1,yt=yP-450*ppm-4;
  const lvl=hd[i]+(+CFG.noise||0)*0.5*Math.sin(T*6+i*1.7),yl=yP-lvl*ppm;
  c.fillStyle="rgba(255,255,255,.05)";c.fillRect(x-tw/2,yt,tw,yb-yt);
  c.fillStyle=WATER;c.fillRect(x-tw/2+1,yl,tw-2,yb-yl+1);
  c.strokeStyle="rgba(150,210,255,.95)";c.lineWidth=1;c.beginPath();c.moveTo(x-tw/2+1,yl-1.2);c.quadraticCurveTo(x,yl+1.2,x+tw/2-1,yl-1.2);c.stroke();
  c.strokeStyle=GLASS;c.strokeRect(x-tw/2,yt,tw,yb-yt);
  txt(c,"ABCDE"[i],x,m+6,"center",12,"#E8B23A");
  txt(c,"Ø"+VT.D[i].toFixed(1),x,yP+rmax+(i%2?24:12),"center",10,"#7FD4A8")});
 // stream into tank
 const th=yT1-yT0,yw=yT1-S.vol/3*th;
 c.fillStyle="rgba(70,150,215,.6)";c.fillRect(xc-ro*0.55,yOut,ro*1.1,yw-yOut);
 // tank
 c.fillStyle="rgba(255,255,255,.04)";c.fillRect(tx0,yT0,tankW,th);
 c.fillStyle=WATER;c.fillRect(tx0,yw,tankW,yT1-yw);
 for(let k=0;k<=30;k++){const y=yT1-k/30*th,len=k%5===0?10:5;c.strokeStyle=FG+(k%5===0?".7)":".4)");c.beginPath();c.moveTo(tx1,y);c.lineTo(tx1-len,y);c.stroke();
  if(k%5===0&&k>0)txt(c,(k/10).toFixed(1),tx1-13,y,"right",9)}
 txt(c,"L",tx1-3,yT0-8,"right",10,FG+".6)");
 c.strokeStyle=GLASS;c.lineWidth=1.5;c.beginPath();c.moveTo(tx0,yT0);c.lineTo(tx0,yT1);c.lineTo(tx1,yT1);c.lineTo(tx1,yT0);c.stroke();
 // drain
 c.fillStyle=S.coll?"#E8B23A":"#7FD4A8";c.fillRect(tx1,yT1-8,8,6);
 if(!S.coll&&S.vol>0){c.fillStyle="rgba(70,150,215,.8)";c.fillRect(tx1+3,yT1-4,5,m+4)}
 if(S.vol>=3)txt(c,L1.full,tx0+tankW/2,yT0+10,"center",11,"#E8B23A");
}

function drawP3(c){
 const port=W<H*1.05,m=10,L1=L[S.lang];
 const tankW=port?Math.max(64,W*0.23):Math.min(190,W*0.17);
 const tx1=W-m-8,tx0=tx1-tankW,x0=m+28,x1=tx0-24;
 const yP=Math.round(H*(port?0.64:0.62)),top=m+20,ppm=(yP-top)/450;
 const rmax=Math.max(7,Math.min(18,(x1-x0)*0.035,(H-yP)*0.1));
 const X=u=>x0+(x1-x0)*u,R=u=>rmax*diam3(u)/D1,YC=u=>yP-z3(u)*ppm;
 // board
 c.fillStyle="rgba(255,255,255,.035)";c.fillRect(x0,yP-450*ppm,x1-x0,450*ppm);
 for(let mm=0;mm<=450;mm+=10){const y=yP-mm*ppm;c.strokeStyle=mm%50===0?FG+".34)":FG+".1)";c.lineWidth=1;c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke();
  if(mm%50===0){txt(c,String(mm),x0-4,y,"right",10);txt(c,String(mm),x1+3,y,"left",10)}}
 txt(c,"mm",x0-4,m+6,"right",10,FG+".5)");
 // outlet pipe
 const ro=R(1),xc=tx0+tankW*0.35,yT0=yP+rmax+34,yT1=H-m,yOut=yT0-6,yE=YC(1);
 c.fillStyle=WATER;c.strokeStyle=GLASS;c.lineWidth=1.5;
 c.beginPath();c.moveTo(X(1)-1,yE-ro);c.lineTo(xc+ro,yE-ro);c.lineTo(xc+ro,yOut);c.lineTo(xc-ro,yOut);c.lineTo(xc-ro,yE+ro);c.lineTo(X(1)-1,yE+ro);c.closePath();c.fill();c.stroke();
 // pipe body
 c.beginPath();c.moveTo(m,yP-rmax);for(let u=0;u<=1.0001;u+=0.005)c.lineTo(X(u),YC(u)-R(u));
 for(let u=1;u>=-0.0001;u-=0.005)c.lineTo(X(u),YC(u)+R(u));c.lineTo(m,yP+rmax);c.closePath();c.fill();c.stroke();

function drawP2(c){
 const m=12,s=Math.min((W-2*m)/1.17,(H-2*m)/0.9),ox=(W-1.17*s)/2+0.3*s,fy=H-m-0.035*s;

 // floor
 c.strokeStyle=FG+".5)";c.lineWidth=1.5;c.beginPath();c.moveTo(SX(-0.3),fy);c.lineTo(SX(0.87),fy);c.stroke();

  if(k%10===0)txt(c,String(k),x,fy+9,"center",10)}
 txt(c,"cm",SX(0.87),fy+9,"right",9,FG+".5)");
 // vertical ruler
 const rx=SX(-0.27);
 for(let k=0;k<=80;k++){const yy=SY(k/100),len=k%10===0?0.016*s:k%5===0?0.011*s:0.006*s;c.strokeStyle=FG+(k%10===0?".8)":".4)");c.beginPath();c.moveTo(rx,yy);c.lineTo(rx+len,yy);c.stroke();
  if(k%10===0)txt(c,String(k),rx-3,yy,"right",10,"#E8B23A")}
 c.strokeStyle=FG+".5)";c.beginPath();c.moveTo(rx,fy);c.lineTo(rx,SY(0.8));c.stroke();
 c.strokeStyle="rgba(232,178,58,.7)";c.setLineDash([3,4]);c.beginPath();c.moveTo(rx,SY(y));c.lineTo(SX(0),SY(y));c.stroke();c.setLineDash([]);
 // stand
 c.fillStyle="#34475C";c.fillRect(SX(-0.195),SY(yb),0.012*s,yb*s);c.fillRect(SX(-0.017),SY(yb),0.012*s,yb*s);c.fillRect(SX(-0.21),SY(yb),0.22*s,0.01*s);
 // water in tank
 c.fillStyle=WATER;c.fillRect(SX(-0.2),SY(lev),0.2*s,(lev-yb)*s);
 c.strokeStyle="rgba(150,210,255,.9)";c.beginPath();c.moveTo(SX(-0.2),SY(lev));c.lineTo(SX(0),SY(lev));c.stroke();
 // tank walls
 c.strokeStyle=GLASS;c.lineWidth=2;c.beginPath();c.moveTo(SX(-0.2),SY(ytop));c.lineTo(SX(-0.2),SY(yb));c.lineTo(SX(0),SY(yb));c.lineTo(SX(0),SY(ytop));c.stroke();
 // tank scale (0 at hole)

  if(k%5===0)txt(c,String(k),SX(-0.2)-len-2,yy,"right",9,"#7FD4A8")}
 // labels
 txt(c,"A = 75 cm²",SX(-0.1),SY(yb)+0.05*s,"center",10,"#7FD4A8");txt(c,"Ø4 mm",SX(0)+6,SY(y)-10,"left",10,"#7FD4A8");
 // hole
 c.fillStyle="#061019";c.beginPath();c.arc(SX(0),SY(y),Math.max(2.5,0.004*s),0,7);c.fill();
 // jet
 if(S.on&&h>0.002){const v=NZ.cv*Math.sqrt(2*g*h),Tf=Math.sqrt(2*y/g),xj=(+CFG.noise||0)*0.0015*Math.sin(T*3.1);
  c.beginPath();for(let i=0;i<=60;i++){const t=Tf*i/60;c.lineTo(SX(v*t+xj*i/60),SY(y-g*t*t/2))}

  const xs=SX(v*Tf+xj);c.strokeStyle="rgba(150,210,255,.8)";c.lineWidth=1;
  for(let k=-1;k<=1;k+=2){c.beginPath();c.moveTo(xs,fy-1);c.quadraticCurveTo(xs+k*6,fy-8-2*Math.abs(Math.sin(T*9)),xs+k*10,fy-1);c.stroke()}}
}

/* ---------- lens ---------- */
const lens={on:false,x:0,y:0};
function lensPos(e){const r=cv.getBoundingClientRect();lens.x=(e.clientX-r.left)*DPR;lens.y=(e.clientY-r.top)*DPR}
cv.addEventListener("pointerdown",e=>{lens.on=true;lensPos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener("pointermove",e=>{if(lens.on)lensPos(e)});
["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,()=>lens.on=false));
function drawLens(){const Z=3,R=75*DPR,sw=2*R/Z;
 let sx=Math.min(Math.max(lens.x-sw/2,0),buf.width-sw),sy=Math.min(Math.max(lens.y-sw/2,0),buf.height-sw);
 let lx=lens.x,ly=lens.y-R-30*DPR;if(ly<R)ly=lens.y+R+30*DPR;lx=Math.min(Math.max(lx,R+4),cv.width-R-4);
 ctx.save();ctx.beginPath();ctx.arc(lx,ly,R,0,7);ctx.fillStyle="#0B1A2B";ctx.fill();ctx.clip();
 ctx.drawImage(buf,sx,sy,sw,sw,lx-R,ly-R,2*R,2*R);
 const cy=ly-R+(lens.y-sy)*Z;ctx.strokeStyle="rgba(232,178,58,.8)";ctx.lineWidth=DPR;ctx.beginPath();ctx.moveTo(lx-R,cy);ctx.lineTo(lx+R,cy);ctx.stroke();
 ctx.restore();ctx.strokeStyle="#E8B23A";ctx.lineWidth=2*DPR;ctx.beginPath();ctx.arc(lx,ly,R,0,7);ctx.stroke()}

function fmt(ms){const cs=Math.floor(ms/10),m=Math.floor(cs/6000),s=Math.floor(cs/100)%60,c=cs%100;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(c).padStart(2,"0")}

$("resetBtn").onclick=()=>{tRun=false;tAcc=0;$("playBtn").textContent="▶";$("playBtn").classList.remove("run");$("clock").textContent=fmt(0)};

function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;update(dt);
 b.setTransform(DPR,0,0,DPR,0,0);b.clearRect(0,0,W,H);S.part===1?drawP1(b):S.part===2?drawP2(b):drawP3(b);

 if(tRun)$("clock").textContent=fmt(tAcc+now-tStart);requestAnimationFrame(frame)}
